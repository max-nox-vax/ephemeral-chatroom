<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Access · Ephemeral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-body">
  <div class="login-stage">
    <div class="login-card">
      <h1 class="login-title">Ephemeral</h1>
      <p class="login-sub">Nothing is kept. Enter the code to continue.</p>

      <form id="login-form" autocomplete="off">
        <label class="code-label" for="code">ACCESS CODE</label>
        <input id="code" name="code" type="password" inputmode="text" placeholder="••••••••" autofocus />
        <button type="submit" id="go-btn">
          <span id="go-text">GO</span>
          <span id="go-spinner" class="spinner" hidden></span>
        </button>
      </form>
      <div id="error-msg" class="error-msg" hidden></div>
    </div>
    <div class="scan-line"></div>
  </div>
</body>
<script src="/js/login.js"></script>
</html>
